name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Give the pipeline explicit permissions to read code and write packages
permissions:
  contents: read
  packages: write

jobs:
  # --- Your Existing Test Job ---
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Validation Engine
        run: pytest

  # --- New Advanced CD Delivery Job ---
  delivery:
    runs-on: ubuntu-latest
    needs: test # CRITICAL: This job only runs if the test job passes completely!
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' # Only build on merges to main

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Lowercase Repository Path Variable
        id: format_env
        run: |
          LOWERCASE_REPO=$(python3 -c "print('${{ github.repository }}'.lower())")
          echo "REPO_LC=${LOWERCASE_REPO}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        # Buildx unlocks advanced multi-platform building and caching engines

      - name: Log into GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }} # Automatically grabs your GitHub username
          password: ${{ secrets.GITHUB_TOKEN }} # Seamless secure handshake

      - name: Build and Push Production Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Due to rules and regulations of Docker the entire string must be lowercased for a clean accept
          tags: |
            ghcr.io/${{ env.REPO_LC }}:latest
