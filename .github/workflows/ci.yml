name: Stream Pipeline CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Python Tests ────────────────────────────────────────────────────
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        env:
          AWS_ACCESS_KEY_ID: "mock-key-id"
          AWS_SECRET_ACCESS_KEY: "mock-secret-key"
          AWS_DEFAULT_REGION: "us-east-2"
          AMAZON_S3_BUCKET_NAME: "mock-testing-bucket"
        run: |
          PYTHONPATH=. python -m pytest -v

  # ── Job 2: Lint ─────────────────────────────────────────────────────────────
  lint:
    name: Lint Python Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: |
          flake8 app.py metrics_server.py \
            v2_upgraded/generate_analytics.py \
            v2_upgraded/upload_payloads.py \
            v2_upgraded/stream_planner_v2.py \
            --max-line-length=120 \
            --ignore=E501,W503,E402

  # ── Job 3: Validate Kubernetes Manifests ───────────────────────────────────
  validate-k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubeval
        run: |
          wget https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
          tar xf kubeval-linux-amd64.tar.gz
          sudo mv kubeval /usr/local/bin

      - name: Validate manifests
        run: |
          kubeval k8s/namespace.yaml
          kubeval k8s/configmap.yaml
          kubeval k8s/deployment.yaml
          kubeval k8s/service.yaml
          kubeval k8s/cronjob.yaml
          echo "All manifests validated successfully."

  # ── Job 4: Build Docker Images ─────────────────────────────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dashboard image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: tbagnardi/stream-automation:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build generator image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.generator
          push: false
          tags: tbagnardi/stream-automation:generator
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 5: Push to Docker Hub (main branch only) ───────────────────────────
  push:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push dashboard image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            tbagnardi/stream-automation:latest
            tbagnardi/stream-automation:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push generator image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.generator
          push: true
          tags: |
            tbagnardi/stream-automation:generator
            tbagnardi/stream-automation:generator-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
