name: Python Ingestion Pipeline CI

# Trigger this pipeline one every push or pull request to the main branch
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  continuous_integration:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone your code repository into the GitHub cloud runner
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      # Step 2: Set up isolated Python runtime environment
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip" # Auto caches dependencies to speed up future runs

      # Step 3: Upgrade pip and install all production/testing envrionments
      - name: Install Pipeline Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Step 4: Run Automated QA Validation Suite
      - name: Execute Automated Validaiton Suites (Pytest)
        env:
          # Inject dummy environment variables so code initializes safely
          AWS_ENDPOINT_URL: "https://localhost:4566"
          AWS_S3_BUCKET_NAME: "mock-testing-bucket"
          AWS_DEFAULT_REGION: "us-east-1"
        run: |
          PYTHONPATH=. pytest -v
