apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: streamlit-dashboard
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - stream-pipeline
  selector:
    matchLabels:
      app: streamlit-dashboard
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
